name: Docker images

# Builds the three images on pull requests that touch them, on tags and on demand. Nothing is pushed by default: the publish job at
# the bottom stays skipped until the repository variable PUBLISH_IMAGES is set to "true" (Settings > Secrets and variables >
# Actions > Variables), which the owner does when images may go to ghcr.io.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, "docker/**", "grove/**", pyproject.toml, ".github/workflows/docker.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          tags: grove-worker:ci
      - name: Build the fetcher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/fetcher.Dockerfile
          push: false
          tags: grove-fetcher:ci
      # The plugin image is built FROM the Hearth image, which is built FROM the StoneSage image. Neither is published yet: build
      # them from their repositories first, with the default Docker builder (the only one that sees a locally built image).
      - uses: actions/checkout@v4
        with:
          repository: lottage/stonesage
          path: _ci/stonesage
      - uses: actions/checkout@v4
        with:
          repository: lottage/hearth
          path: _ci/hearth
      - name: Build the StoneSage image
        uses: docker/build-push-action@v6
        with:
          context: _ci/stonesage
          push: false
          tags: stonesage:ci
      - name: Build the Hearth image
        uses: docker/build-push-action@v6
        with:
          context: _ci/hearth
          build-args: STONESAGE_IMAGE=stonesage:ci
          push: false
          tags: hearth:ci
      - name: Build the Grove image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BASE_IMAGE=hearth:ci
          push: false
          tags: grove:ci

  publish:
    # OFF until PUBLISH_IMAGES is "true" and a version tag is pushed.
    if: ${{ vars.PUBLISH_IMAGES == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: grove
            file: Dockerfile
          - image: grove-worker
            file: docker/worker.Dockerfile
          - image: grove-fetcher
            file: docker/fetcher.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lottage/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
