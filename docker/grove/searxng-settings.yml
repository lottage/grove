# SearXNG for Grove's reader (generated by lodestone.installer --with-garden). No secret here: the secret key comes from the
# SEARXNG_SECRET environment variable (GROVE_SEARXNG_SECRET in .env). The reader asks for JSON; nothing else uses this instance.
use_default_settings: true
search:
  formats:
    - html
    - json
server:
  limiter: false
  image_proxy: false
