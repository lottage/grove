# Generated by `python -m lodestone.installer --docker` (profile cpu, CPU only). Edit freely; re-generating writes a backup.
# Engines use llama.cpp's published images (ghcr.io/ggml-org/llama.cpp:server-b10818); the tag is LLAMA_CPP_IMAGE in .env.
# Start:  docker compose up -d --build     The images are built from GitHub (v0.1.0-rc.9), then the models are downloaded (several GB): docker compose logs -f models
# Secrets: none in this file; the API key and the Home Assistant token go in .env.
# Grove is on: grove-worker has no route to the internet; grove-fetcher and grove-searxng have one, which grove-firewall.sh (next to this file) filters. Read it, then run it as root before `docker compose up`.
name: "lodestone"
services:
  # one-shot: downloads the models into the shared volume (resumable; SHA-256 in SHA256SUMS), then exits
  models:
    image: "${LODESTONE_IMAGE:-ghcr.io/lottage/lodestone:0.1.0-rc.9}"
    pull_policy: "never"
    restart: "no"
    command: ["sh", "-c", "python -m lodestone.model_downloader --repo ibm-granite/granite-4.0-h-tiny-GGUF --file granite-4.0-h-tiny-Q4_K_M.gguf --dest /models && python -m lodestone.model_downloader --repo CompendiumLabs/bge-large-en-v1.5-gguf --file bge-large-en-v1.5-f16.gguf --dest /models && cd /models && ( [ \"$$LODESTONE_VERIFY_MODELS\" != 1 ] || sha256sum -c SHA256SUMS )"]
    environment:
      LODESTONE_VERIFY_MODELS: "${LODESTONE_VERIFY_MODELS:-0}"
    volumes: ["models:/models"]

  # coordinator engine (granite-4.0-h-tiny-Q4_K_M.gguf) on the CPU; reachable by the other services only
  coordinator:
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b10818}"
    restart: "unless-stopped"
    command:
      - "--model"
      - "/models/granite-4.0-h-tiny-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"
      - "--device"
      - "none"
      - "-t"
      - "8"
      - "-c"
      - "8192"
      - "-np"
      - "1"
      - "-b"
      - "2048"
      - "-ub"
      - "512"
      - "--flash-attn"
      - "on"
      - "-ctk"
      - "q8_0"
      - "-ctv"
      - "q8_0"
      - "--jinja"
      - "--alias"
      - "coordinator"
      - "--metrics"
      - "--slots"
      - "--props"
    volumes: ["models:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: "15s"
      timeout: "5s"
      retries: 20
      start_period: "120s"
    depends_on:
      models:
        condition: "service_completed_successfully"

  # embedder engine (bge-large-en-v1.5-f16.gguf) on the CPU; reachable by the other services only
  embedder:
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b10818}"
    restart: "unless-stopped"
    command:
      - "--model"
      - "/models/bge-large-en-v1.5-f16.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8003"
      - "--device"
      - "none"
      - "-t"
      - "2"
      - "--embedding"
      - "-c"
      - "512"
      - "-b"
      - "512"
      - "-ub"
      - "512"
      - "--alias"
      - "embedder"
      - "--metrics"
    volumes: ["models:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: "15s"
      timeout: "5s"
      retries: 20
      start_period: "120s"
    depends_on:
      models:
        condition: "service_completed_successfully"

  # the one address to use: an OpenAI-compatible API in front of the engines (http://localhost:8000/v1)
  gateway:
    image: "${LODESTONE_IMAGE:-ghcr.io/lottage/lodestone:0.1.0-rc.9}"
    build:
      context: "https://github.com/lottage/lodestone.git#v0.1.0-rc.9"
    restart: "unless-stopped"
    command:
      - "python"
      - "-m"
      - "lodestone.gateway"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      COORDINATOR_URL: "http://coordinator:8001/v1"
      EMBEDDER_URL: "http://embedder:8003/v1"
      LODESTONE_API_KEY: "${LODESTONE_API_KEY:?set LODESTONE_API_KEY in .env}"
      COORDINATOR_CPU: "1"
    ports: ["${LODESTONE_BIND:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: "30s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    depends_on:
      coordinator:
        condition: "service_healthy"
      embedder:
        condition: "service_healthy"

  # one-shot, build only: makes the StoneSage image that the Hearth image below is built FROM, then exits
  stonesage-image:
    image: "ghcr.io/lottage/stonesage:0.1.0-rc.9"
    build:
      context: "https://github.com/lottage/stonesage.git#v0.1.0-rc.9"
      args:
        LODESTONE_PIP: "lodestone @ git+https://github.com/lottage/lodestone@v0.1.0-rc.9"
    entrypoint: ["true"]
    restart: "no"

  # StoneSage with the Hearth app and the Grove add-on: the cockpit on http://localhost:8888
  stonesage:
    image: "${STONESAGE_IMAGE:-ghcr.io/lottage/grove:0.1.0-rc.9}"
    restart: "unless-stopped"
    environment:
      COORDINATOR_URL: "http://coordinator:8001/v1"
      EMBEDDER_URL: "http://embedder:8003/v1"
      STONESAGE_APPS: "hearth,grove"
      HASS_URL: "${HASS_URL:-http://homeassistant.local:8123}"
      HASS_TOKEN: "${HASS_TOKEN:-}"
      TZ: "${TZ:-UTC}"
      STONESAGE_API_KEY: "${STONESAGE_API_KEY:?set STONESAGE_API_KEY in .env}"
      STONESAGE_ALLOWED_HOSTS: "stonesage,${STONESAGE_ALLOWED_HOSTS:-}"
      COORDINATOR_CPU: "1"
      GROVE_WORKER_URL: "http://grove-worker:8780"
      GROVE_ENGINE_URL: "http://coordinator:8001/v1"
      GROVE_MODEL: "granite-4.0-h-tiny-Q4_K_M"
      GROVE_RESIDENT: "resident-1"
      STONESAGE_GROVE_CONTROL_KEY: "${GROVE_CONTROL_KEY:?set GROVE_CONTROL_KEY in .env}"
      STONESAGE_GROVE_MODEL_KEY: "${GROVE_MODEL_KEY:?set GROVE_MODEL_KEY in .env}"
    ports: ["${STONESAGE_BIND:-127.0.0.1}:${STONESAGE_PORT:-8888}:8888"]
    volumes: ["stonesage-config:/config", "stonesage-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api/health', timeout=3)"]
      interval: "30s"
      timeout: "5s"
      retries: 5
      start_period: "60s"
    depends_on:
      coordinator:
        condition: "service_healthy"
      embedder:
        condition: "service_healthy"
      stonesage-image:
        condition: "service_completed_successfully"
      hearth-image:
        condition: "service_completed_successfully"
    build:
      context: "https://github.com/lottage/grove.git#v0.1.0-rc.9"
      args:
        BASE_IMAGE: "hearth-image"
      additional_contexts:
        hearth-image: "service:hearth-image"
    networks: ["default", "grove-model"]

  # one-shot, build only: makes the Hearth image that the Grove image below is built FROM, then exits
  hearth-image:
    image: "ghcr.io/lottage/hearth:0.1.0-rc.9"
    build:
      context: "https://github.com/lottage/hearth.git#v0.1.0-rc.9"
      args:
        STONESAGE_IMAGE: "stonesage-image"
      additional_contexts:
        stonesage-image: "service:stonesage-image"
    entrypoint: ["true"]
    restart: "no"

  # Grove's worker: holds the residents. Internal networks only: it reaches the cockpit's model proxy and the reader, nothing else, and has no route to the internet
  grove-worker:
    image: "${GROVE_WORKER_IMAGE:-ghcr.io/lottage/grove-worker:0.1.0-rc.9}"
    build:
      context: "https://github.com/lottage/grove.git#v0.1.0-rc.9"
      dockerfile: "docker/worker.Dockerfile"
    restart: "unless-stopped"
    environment:
      GROVE_CONTROL_KEY: "${GROVE_CONTROL_KEY:?set GROVE_CONTROL_KEY in .env}"
      GROVE_MODEL_KEY: "${GROVE_MODEL_KEY:?set GROVE_MODEL_KEY in .env}"
      GROVE_MODEL_URL: "http://stonesage:8888/api/garden/v1"
      GROVE_FETCHER_URL: "http://grove-fetcher:8090"
      GROVE_FETCHER_KEY: "${GROVE_FETCHER_KEY:?set GROVE_FETCHER_KEY in .env}"
      GROVE_DATA_DIR: "/data"
      GROVE_FIRST_RESIDENT: "resident-1"
    volumes: ["grove-data:/data"]
    networks: ["grove-model", "grove-web"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8780/health', headers={'Authorization': 'Bearer ' + os.environ['GROVE_CONTROL_KEY']}), timeout=3)"]
      interval: "30s"
      timeout: "5s"
      retries: 5
      start_period: "20s"

  # Grove's web reader: GET /read and /search for the worker. On the internal web network and on grove-egress (internet, filtered by grove-firewall.sh)
  grove-fetcher:
    image: "${GROVE_FETCHER_IMAGE:-ghcr.io/lottage/grove-fetcher:0.1.0-rc.9}"
    build:
      context: "https://github.com/lottage/grove.git#v0.1.0-rc.9"
      dockerfile: "docker/fetcher.Dockerfile"
    restart: "unless-stopped"
    environment:
      FETCHER_KEY: "${GROVE_FETCHER_KEY:?set GROVE_FETCHER_KEY in .env}"
      READER_SEARX_URL: "http://grove-searxng:8080"
    networks: ["grove-web", "grove-egress"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8090/health', headers={'Authorization': 'Bearer ' + os.environ['FETCHER_KEY']}), timeout=3)"]
      interval: "30s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    depends_on:
      grove-searxng:
        condition: "service_started"

  # SearXNG (pinned by tag) for the reader's searches; on grove-egress only
  grove-searxng:
    image: "${GROVE_SEARXNG_IMAGE:-docker.io/searxng/searxng:2026.9.30-a9d990033}"
    restart: "unless-stopped"
    environment:
      SEARXNG_SECRET: "${GROVE_SEARXNG_SECRET:?set GROVE_SEARXNG_SECRET in .env}"
      SEARXNG_BASE_URL: "http://grove-searxng:8080/"
    volumes: ["./grove/searxng-settings.yml:/etc/searxng/settings.yml:ro"]
    networks: ["grove-egress"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]

volumes:
  models: {}
  stonesage-config: {}
  stonesage-data: {}
  grove-data: {}

networks:
  grove-model:
    internal: true
  grove-web:
    internal: true
  grove-egress:
    driver: "bridge"
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: "br-grove-egress"
