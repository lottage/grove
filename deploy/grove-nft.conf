# Grove: who may connect to what, by user (generated by lodestone.installer --with-garden; review it before you load it).
#   load:   sudo nft -f /etc/grove/grove-nft.conf          remove: sudo nft delete table inet grove
#   persist: add  include "/etc/grove/grove-nft.conf"  to /etc/nftables.conf and enable nftables.service
# Only connections made BY these two users are filtered; every other user and all inbound traffic are untouched.
# On one machine this is weaker than separate machines or containers: root can unload it, and it holds only while it is loaded.
define dns_servers = { 127.0.0.53 }          # systemd-resolved's stub; list your resolvers here if /etc/resolv.conf names others

table inet grove {
    chain output {
        type filter hook output priority 0; policy accept;

        # the reader (user grovereader): the public internet and nothing private
        meta skuid "grovereader" ct state established,related accept
        meta skuid "grovereader" ip daddr 127.0.0.1 tcp dport 8080 accept         # SearXNG on this machine
        meta skuid "grovereader" ip daddr $dns_servers udp dport 53 accept
        meta skuid "grovereader" ip daddr $dns_servers tcp dport 53 accept
        meta skuid "grovereader" ip daddr { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4 } counter drop
        meta skuid "grovereader" meta nfproto ipv6 counter drop                        # IPv6 is not used: ULA and NAT64 ranges are hard to rule out

        # the worker (user grove): the reader and StoneSage's model proxy, nothing else
        meta skuid "grove" ct state established,related accept
        meta skuid "grove" ip daddr 127.0.0.1 tcp dport 8090 accept   # the reader
        meta skuid "grove" ip daddr 127.0.0.1 tcp dport 8888 accept             # StoneSage
        meta skuid "grove" counter drop
    }
}
