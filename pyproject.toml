[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grove"
version = "0.1.0rc8"
description = "Optional add-on app for StoneSage: residents who write, search and read with no task, kept as a research record."
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = [
  "lodestone @ git+https://github.com/lottage/lodestone@v0.1.0-rc.8",
  "stonesage @ git+https://github.com/lottage/stonesage@v0.1.0-rc.8"
]

[project.urls]
Homepage = "https://github.com/lottage/grove"

[tool.setuptools.packages.find]
include = ["grove*"]

[tool.setuptools.package-data]
grove = ["static/*.js"]

[project.entry-points."stonesage.apps"]
grove = "grove.app"
